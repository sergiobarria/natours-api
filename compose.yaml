services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: natours_dev
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d natours_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5433:5432'
    volumes:
      - natours_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  natours_postgres_data:
