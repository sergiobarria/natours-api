name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/natours_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/natours_test
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: natours-ci
      JOBS_QUEUE_NAME: natours-ci-jobs
      JOBS_WORKER_CONCURRENCY: 2
      TRUSTED_PROXY_CIDRS: ''
      RATE_LIMIT_GLOBAL_LIMIT: 1000
      RATE_LIMIT_GLOBAL_TTL_MS: 60000
      RATE_LIMIT_GLOBAL_BLOCK_MS: 60000
      RATE_LIMIT_AUTH_LIMIT: 100
      RATE_LIMIT_AUTH_TTL_MS: 60000
      RATE_LIMIT_AUTH_BLOCK_MS: 60000
      RATE_LIMIT_ACCOUNT_LIMIT: 100
      RATE_LIMIT_ACCOUNT_TTL_MS: 60000
      RATE_LIMIT_ACCOUNT_BLOCK_MS: 60000
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5173
      EMAIL_PROVIDER: fake
      RESEND_API_KEY: ''
      MAIL_FROM_ADDRESS: hello@example.com
      MAIL_FROM_NAME: Natours
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: natours_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d natours_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check
      - name: Check schema and migration drift
        run: |
          pnpm db:generate
          git add --intent-to-add drizzle
          git diff --exit-code -- drizzle
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm test --runInBand
      - run: pnpm test:integration
      - run: pnpm test:redis
      - run: pnpm test:e2e --runInBand
      - run: pnpm test:processes
      - run: pnpm openapi:check
