name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/natours_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/natours_test
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: natours_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d natours_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check
      - name: Check schema and migration drift
        run: |
          pnpm db:generate
          git add --intent-to-add drizzle
          git diff --exit-code -- drizzle
      - run: pnpm test --runInBand
      - run: pnpm test:integration
      - run: pnpm test:e2e --runInBand
      - run: pnpm openapi:check
      - run: pnpm build
