name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/natours_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/natours_test
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: natours-ci
      REDIS_CONNECT_TIMEOUT_MS: 5000
      REDIS_COMMAND_TIMEOUT_MS: 5000
      REDIS_MAX_RETRIES_PER_REQUEST: 1
      JOBS_QUEUE_NAME: natours-ci-jobs
      JOBS_ATTEMPTS: 3
      JOBS_BACKOFF_DELAY_MS: 10
      JOBS_BACKOFF_JITTER: 0
      JOBS_WORKER_CONCURRENCY: 2
      JOBS_LOCK_DURATION_MS: 5000
      JOBS_MAX_STALLED_COUNT: 1
      JOBS_REMOVE_ON_COMPLETE_AGE_SECONDS: 60
      JOBS_REMOVE_ON_COMPLETE_COUNT: 100
      JOBS_REMOVE_ON_FAIL_AGE_SECONDS: 60
      JOBS_REMOVE_ON_FAIL_COUNT: 100
      OUTBOX_POLL_INTERVAL_MS: 50
      OUTBOX_BATCH_SIZE: 10
      PROCESS_SHUTDOWN_TIMEOUT_MS: 1000
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: natours_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d natours_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check
      - name: Check schema and migration drift
        run: |
          pnpm db:generate
          git add --intent-to-add drizzle
          git diff --exit-code -- drizzle
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm test --runInBand
      - run: pnpm test:integration
      - run: pnpm test:redis
      - run: pnpm test:e2e --runInBand
      - run: pnpm test:processes
      - run: pnpm openapi:check
